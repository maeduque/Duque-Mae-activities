<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <script src="js/bootstrap.js"></script>
</head>
<body>
    <!-- ✅ NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="#">My Bootstrap Page</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="#">About</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">

    <!-- ✅ HEADERS -->
    <h1 class="text-primary">Bootstrap Headers</h1>
    <h2>Heading h2</h2>
    <h3>Heading h3</h3>

    <hr>

    <!-- ✅ BUTTONS -->
    <h3>Buttons</h3>
    <button class="btn btn-primary">Primary</button>
    <button class="btn btn-success">Success</button>
    <button class="btn btn-danger">Danger</button>
    <button class="btn btn-warning">Warning</button>
    <button class="btn btn-info">info</button>
    <button class="btn btn-secondary">secondary</button>


    <hr>

    <!-- ✅ ALERTS -->
    <h3>Alerts</h3>
    <div class="alert alert-success">Success! Your action was completed.</div>
    <div class="alert alert-warning">Warning! Please check your input.</div>
    <div class="alert alert-danger">Error! Something went wrong.</div>

    <hr>

    <!-- ✅ TABLE -->
    <h3>Table</h3>
    <table class="table table-bordered table-striped">
        <thead class="table-dark">
            <tr>
                <th>#</th>
                <th>Name</th>
                <th>Course</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>Mae</td>
                <td>BSIT</td>
            </tr>
            <tr>
                <td>2</td>
                <td>dell</td>
                <td>agri</td>
            </tr>
        </tbody>
    </table>

    <hr>

    <!-- ✅ SPINNERS -->
    <h3>Spinners</h3>
    <div class="spinner-border text-primary"></div>
    <div class="spinner-border text-success"></div>
    <div class="spinner-grow text-danger"></div>

</div>

<!-- Bootstrap JS (for navbar toggle) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
