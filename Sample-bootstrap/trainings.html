<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<title>Trainings</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Custom CSS -->
<link rel="stylesheet" href="css/bootstrap.min.css">

</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg bg-dark navbar-dark p-3">

<div class="container-fluid">

<span class="navbar-brand fw-bold">Employee System</span>

<div class="ms-auto">

<a class="btn btn-outline-light me-2" href="dashboard.html">Dashboard</a>
<a class="btn btn-outline-light me-2" href="employees_list.html">Employees</a>
<a class="btn btn-outline-light me-2" href="employees_info.html">Employee Info</a>
<a class="btn btn-outline-light me-2" href="trainings.html">Trainings</a>
<a class="btn btn-outline-light me-2" href="service_record.html">Service Record</a>
<a class="btn btn-danger" href="login.html">Logout</a>

</div>

</div>
</nav>


<!-- CONTENT -->
<div class="container mt-4">

<div class="d-flex justify-content-between align-items-center mb-3">

<h3>Employee Trainings</h3>
<button class="btn btn-purple" onclick="addTraining()">+ Add Trainings</button>

</div>

<input class="form-control mb-3" placeholder="Search trainings">

<div class="table-responsive">

<table class="table table-striped align-middle" id="trainingTable">

<thead>
<tr>
<th>ID</th>
<th>Title</th>
<th>Date</th>
<th>Actions</th>
</tr>
</thead>

<tbody>

<tr>
<td>1</td>
<td>Safety Training</td>
<td>2024</td>
<td>
<a href="employees_info.html" class="btn btn-sm btn-light">View</a>
<button class="btn btn-sm btn-warning" onclick="editRow(this)">Edit</button>
<button class="btn btn-sm btn-danger" onclick="deleteRow(this)">Delete</button>
</td>
</tr>

<tr>
<td>2</td>
<td>Leadership</td>
<td>2025</td>
<td>
<a href="employees_info.html" class="btn btn-sm btn-light">View</a>
<button class="btn btn-sm btn-warning" onclick="editRow(this)">Edit</button>
<button class="btn btn-sm btn-danger" onclick="deleteRow(this)">Delete</button>
</td>
</tr>

</tbody>

</table>
</div>
</div>


<!-- Bootstrap JS -->
<script src="js/bootstrap.js"></script>

<script>

function addTraining(){

let table = document.getElementById("trainingTable").getElementsByTagName("tbody")[0];

let id = prompt("Enter ID");
let title = prompt("Enter Training Title");
let date = prompt("Enter Training Date");

if(id && title && date){

let row = table.insertRow();

row.innerHTML = `
<td>${id}</td>
<td>${title}</td>
<td>${date}</td>
<td>
<a href="employees_info.html" class="btn btn-sm btn-light">View</a>
<button class="btn btn-sm btn-warning" onclick="editRow(this)">Edit</button>
<button class="btn btn-sm btn-danger" onclick="deleteRow(this)">Delete</button>
</td>
`;

}

}

function deleteRow(button){

if(confirm("Delete this record?")){

let row = button.parentNode.parentNode;
row.remove();

}

}

function editRow(button){

let row = button.parentNode.parentNode;
let cells = row.getElementsByTagName("td");

let id = prompt("Edit ID", cells[0].innerText);
let title = prompt("Edit Title", cells[1].innerText);
let date = prompt("Edit Date", cells[2].innerText);

cells[0].innerText = id;
cells[1].innerText = title;
cells[2].innerText = date;

}

</script>

</body>
</html>
