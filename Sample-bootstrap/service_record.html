<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<title>Service Record</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Custom CSS -->
<link rel="stylesheet" href="css/bootstrap.min.css">

</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg bg-dark navbar-dark p-3">

<div class="container-fluid">

<span class="navbar-brand fw-bold">Employee System</span>

<div class="ms-auto">

<a class="btn btn-outline-light me-2" href="dashboard.html">Dashboard</a>
<a class="btn btn-outline-light me-2" href="employees_list.html">Employees</a>
<a class="btn btn-outline-light me-2" href="employees_info.html">Employee Info</a>
<a class="btn btn-outline-light me-2" href="trainings.html">Trainings</a>
<a class="btn btn-outline-light me-2" href="service_record.html">Service Record</a>
<a class="btn btn-danger" href="login.html">Logout</a>

</div>

</div>
</nav>


<!-- CONTENT -->
<div class="container mt-4">

<div class="d-flex justify-content-between align-items-center mb-3">

<h3>Employee List</h3>
<button class="btn btn-purple" onclick="addEmployee()">+ Add Records</button>

</div>

<input class="form-control mb-3" placeholder="Search service record">

<div class="table-responsive">

<table class="table table-striped align-middle" id="serviceTable">

<thead>
<tr>
<th>ID</th>
<th>Position</th>
<th>Start</th>
<th>End</th>
<th>Actions</th>
</tr>
</thead>

<tbody>

<tr>
<td>1</td>
<td>Manager</td>
<td>2022</td>
<td>2024</td>
<td>
<a href="employees_info.html" class="btn btn-sm btn-light">View</a>
<button class="btn btn-sm btn-warning" onclick="editRow(this)">Edit</button>
<button class="btn btn-sm btn-danger" onclick="deleteRow(this)">Delete</button>
</td>
</tr>

<tr>
<td>2</td>
<td>Staff</td>
<td>2020</td>
<td>2023</td>
<td>
<a href="employees_info.html" class="btn btn-sm btn-light">View</a>
<button class="btn btn-sm btn-warning" onclick="editRow(this)">Edit</button>
<button class="btn btn-sm btn-danger" onclick="deleteRow(this)">Delete</button>
</td>
</tr>

</tbody>

</table>
</div>
</div>


<!-- Bootstrap JS -->
<script src="js/bootstrap.js"></script>

<script>

function addEmployee(){

let table = document.getElementById("serviceTable").getElementsByTagName("tbody")[0];

let id = prompt("Enter ID");
let position = prompt("Enter Position");
let start = prompt("Enter Start Year");
let end = prompt("Enter End Year");

if(id && position && start && end){

let row = table.insertRow();

row.innerHTML = `
<td>${id}</td>
<td>${position}</td>
<td>${start}</td>
<td>${end}</td>
<td>
<a href="employees_info.html" class="btn btn-sm btn-light">View</a>
<button class="btn btn-sm btn-warning" onclick="editRow(this)">Edit</button>
<button class="btn btn-sm btn-danger" onclick="deleteRow(this)">Delete</button>
</td>
`;

}

}

function deleteRow(button){

if(confirm("Delete this record?")){

let row = button.parentNode.parentNode;
row.remove();

}

}

function editRow(button){

let row = button.parentNode.parentNode;
let cells = row.getElementsByTagName("td");

let id = prompt("Edit ID", cells[0].innerText);
let position = prompt("Edit Position", cells[1].innerText);
let start = prompt("Edit Start Year", cells[2].innerText);
let end = prompt("Edit End Year", cells[3].innerText);

cells[0].innerText = id;
cells[1].innerText = position;
cells[2].innerText = start;
cells[3].innerText = end;

}

</script>

</body>
</html>
